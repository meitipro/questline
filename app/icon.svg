<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The mark: a twenty sided die flattened into a square with five pips, the
       middle one in the accent. Drawn at 32 so it survives a 16px favicon -
       the centre pip is the one that carries the idea, so it is the largest. -->
  <rect width="32" height="32" fill="#0A0B0C"/>
  <rect x="5.5" y="5.5" width="21" height="21" fill="none" stroke="#EFEBE2" stroke-width="2"/>
  <circle cx="11" cy="11" r="2" fill="#EFEBE2"/>
  <circle cx="21" cy="11" r="2" fill="#EFEBE2"/>
  <circle cx="16" cy="16" r="2.6" fill="#E9A23B"/>
  <circle cx="11" cy="21" r="2" fill="#EFEBE2"/>
  <circle cx="21" cy="21" r="2" fill="#EFEBE2"/>
</svg>
